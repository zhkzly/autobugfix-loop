name: Operator Governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-operator-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout candidate without credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install trusted dependencies
        working-directory: trusted
        run: uv sync --locked

      - name: Validate candidate with trusted base policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --project trusted python trusted/scripts/validate_operator_pr.py
          --trusted-root trusted
          --candidate-root candidate
          --expected-base-sha ${{ github.event.pull_request.base.sha }}
          --repository ${{ github.repository }}
          --pull-request ${{ github.event.pull_request.number }}
