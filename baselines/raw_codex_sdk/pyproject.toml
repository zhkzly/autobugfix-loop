[project]
name = "raw-codex-sdk-baseline"
version = "0.1.0"
description = "Standalone direct Codex SDK treatment for Autobugfix experiments."
requires-python = ">=3.11"
dependencies = [
    "openai-codex==0.144.4",
    "openai-codex-cli-bin==0.144.4",
]

[project.scripts]
raw-codex-sdk-baseline = "raw_codex_sdk_baseline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.uv]
prerelease = "allow"
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
