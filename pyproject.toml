[project]
name = "autobugfix-loop"
version = "0.1.0"
description = "Local, repo-agnostic, Git-disciplined on-call bugfix control system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=4.44.0",
    "openai-codex>=0.1.0a0",
    "pyyaml>=6.0.2",
]

[project.scripts]
autobugfix = "autobugfix.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.uv]
prerelease = "allow"
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
