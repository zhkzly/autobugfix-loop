task_root: .autobugfix/tasks
scheduler:
  default_max_concurrent: 1
  lock_timeout_seconds: 7200
  max_auto_iterations: 2
  codex_timeout_seconds: 1800
  writer_timeout_seconds: null
  evaluator_timeout_seconds: null
codex:
  writer_model: null
  evaluator_model: null
  controller_model: null
  role_runtime:
    enabled: true
    runtime_root: .autobugfix/runtime/codex-sdk
    bridge_auth: true
    skill_guard: true
    strict_skill_guard: true
eval:
  model_mode: codex
  roles: {}
  benchmarks:
    cache_root: .autobugfix/benchmark-cache
    trusted_case_root: .autobugfix/trusted-eval-cases
    visible_manifest_root: .autobugfix/eval-manifests
    command_timeout_seconds: 1800
    issue_timeout_seconds: 60
    min_free_disk_gb: 10
    guard:
      trusted_ref: origin/main
      # Required for human SWE Holdout operations. Use a mode-0600 unix socket
      # inside the external Guard root for a separately administered VM daemon.
      # The daemon must be distinct from regular Eval and publish the label
      # autobugfix.guard.isolation=dedicated-vm-v1.
      docker_host: null
    raw_codex:
      runner_project: baselines/raw_codex_sdk
      runtime_root: .autobugfix/raw-codex-baseline
      sdk_version: 0.144.4
      cli_version: 0.144.4
      model: gpt-5.4-mini
      reasoning_effort: medium
      service_tier: null
      approval_mode: deny_all
      sandbox: workspace-write
      network_access: false
      timeout_seconds: 500
      swe_timeout_seconds: 900
      require_process_sandbox: true
    defects4j:
      image: autobugfix/defects4j:3.0.1
      verifier_image: autobugfix/defects4j-verifier:3.0.1
      platform: linux/amd64
      framework_revision: 6d54320e0db5a357f9ab38a8e4d2e5aead7e1c09
      timezone: America/Los_Angeles
      preflight_repetitions: 2
      memory_limit: 8g
      cpu_limit: 4.0
      pids_limit: 1024
operator:
  experiment_lines:
    root: .autobugfix/operator-line-worktrees
    checkpoint_root: .autobugfix/operator-checkpoints
    active_release_root: .autobugfix/operator-active-experiments
    branch_template: experiment/{study_id}-main
    remote: origin
    update_timeout_seconds: 300
  budgets:
    allowed_waves: [3, 8, 16]
    allowed_primary_models: [gpt-5.4-mini]
    max_calls_by_wave:
      3: 30
      8: 80
      16: 160
    default_case_concurrency: 1
    max_case_concurrency: 1
    default_max_writer_attempts: 2
    default_max_operator_revisions: 3
    default_wall_time_seconds: 7200
    allow_model_fallback: false
repos:
  target_repo:
    main_checkout: ../target-repo
    remote: origin
    main_branch: main
    branch_template: fix/{date}_oncall_{slug}
    test_commands:
      targeted: uv run pytest --no-cov {target}
      full: uv run pytest
    ppe:
      enabled: false
      command_template: null
